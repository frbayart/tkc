name: server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tkc
          POSTGRES_PASSWORD: tkc
          POSTGRES_DB: tkc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tkc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TKC_TEST_DATABASE_URL: postgres://tkc:tkc@localhost:5432/tkc_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Lint
        run: make lint
      - name: Test
        run: make test
